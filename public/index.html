<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Top News India</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<div class="container">
<div id="app" style="display: none;">
    <header class="header">

        <div class="brand-mark">
            <span class="saffron"></span>
            <span class="blue"></span>
            <span class="green"></span>
        </div>

        <h1>Top News India</h1>
        <div class="date" id="current-date"></div>
        <p class="subtitle">
            The stories that matter, ranked by readers.
        </p>
        <p class="subtitle">
           Source: Indian Express. Total votes today: <span id="total-votes"></span>
        </p>


    </header>


    <div class="toolbar">

        <div class="filters">

            <button
                class="filter"
                data-limit="10"
            >
                Top 10
            </button>

            <button
                class="filter"
                data-limit="all"
            >
                All
            </button>

            <button
                class="filter"
                data-limit="editorial"
            >
                Editorial
            </button>
            <button
                class="filter"
                data-limit="explained"
            >
                Explained
            </button>
             <button
                class="filter"
                data-limit="upsc"
            >
                UPSC
            </button>
            <a
                class="nav-button"
                href="./about"
            >
            About   
        </a>

        </div>

    </div>


    <main
        id="articles"
        class="articles"
    ><div class="empty">
        Loading ...
    </div></main>

    <article id="article-root" style="display: none;">

    </article>


    <div class="footer">

        <span class="footer-line"></span>

        <span>
            Stay informed. Stay curious.
        </span>

        <span class="footer-line"></span>

    </div>

</div>
<div id="loading">
    
        <div class="loader"></div>
   
</div>
</div>
<script type="module" src="./articles.js"></script>


</body>

</html>
